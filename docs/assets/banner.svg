<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ApexTweaker">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#101A2E"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="980" cy="90" rx="260" ry="120" fill="#22D3EE" opacity="0.08"/>
  <ellipse cx="240" cy="340" rx="220" ry="110" fill="#F59E0B" opacity="0.07"/>
  <rect y="208" width="1280" height="2" fill="url(#glow)"/>

  <!-- Mark -->
  <g transform="translate(120,118)" filter="url(#soft)">
    <path d="M48 8 L88 78 L68 78 L48 42 L28 78 L8 78 Z" fill="url(#mark)"/>
    <rect x="20" y="88" width="56" height="6" rx="3" fill="url(#bar)" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="250" y="175" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">ApexTweaker</text>
  <text x="254" y="218" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="500">Windows gaming optimizer · reversible · fail-closed demo</text>

  <!-- Pills -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="254" y="250" width="118" height="34" rx="17" fill="#0EA5E9" opacity="0.18" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="313" y="272" text-anchor="middle" fill="#A5F3FC">.NET 10</text>

    <rect x="384" y="250" width="92" height="34" rx="17" fill="#0EA5E9" opacity="0.12" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="430" y="272" text-anchor="middle" fill="#BAE6FD">WPF</text>

    <rect x="488" y="250" width="128" height="34" rx="17" fill="#F59E0B" opacity="0.12" stroke="#FBBF24" stroke-opacity="0.4"/>
    <text x="552" y="272" text-anchor="middle" fill="#FDE68A">v3.3.1</text>

    <rect x="628" y="250" width="150" height="34" rx="17" fill="#10B981" opacity="0.12" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="703" y="272" text-anchor="middle" fill="#A7F3D0">Demo safe</text>
  </g>

  <!-- Side waveform -->
  <g transform="translate(900,130)" opacity="0.85" fill="none" stroke-linecap="round">
    <path d="M0 90 C20 90 20 20 40 20 S60 160 80 160 S100 40 120 40 S140 120 160 120 S180 70 200 70" stroke="#22D3EE" stroke-width="3"/>
    <path d="M0 90 C20 90 20 45 40 45 S60 135 80 135 S100 55 120 55 S140 110 160 110 S180 80 200 80" stroke="#F59E0B" stroke-width="2" opacity="0.7"/>
    <circle cx="200" cy="70" r="5" fill="#22D3EE"/>
  </g>
</svg>
